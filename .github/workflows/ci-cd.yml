name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-smoke:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run smoke tests
        env:
          JWT_SECRET: ci-test-secret
        run: npm run test:smoke

  backend-auth-integration:
    name: Backend Auth Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_community
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d career_community"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/career_community
          JWT_SECRET: ci-test-secret
        run: npm run migrate

      - name: Run auth integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/career_community
          JWT_SECRET: ci-test-secret
        run: npm run test:auth

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://localhost:5000/api
          VITE_JOBS_ENDPOINT: http://localhost:5000/jobs
          VITE_SOCKET_URL: http://localhost:5000
        run: npm run build

      - name: Upload frontend artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs:
      - backend-smoke
      - backend-auth-integration
      - frontend-build
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.DEPLOY_HOST != '' &&
      secrets.DEPLOY_USER != '' &&
      secrets.DEPLOY_SSH_KEY != '' &&
      vars.BACKEND_DEPLOY_PATH != ''
    environment:
      name: production

    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BACKEND_DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH }}
          BACKEND_PM2_APP: ${{ vars.BACKEND_PM2_APP }}
          DEPLOY_BRANCH: main
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "
            set -e
            cd '${BACKEND_DEPLOY_PATH}'
            git fetch origin '${DEPLOY_BRANCH}'
            git checkout '${DEPLOY_BRANCH}'
            git pull --ff-only origin '${DEPLOY_BRANCH}'
            cd backend
            npm ci
            npm run migrate
            if [ -n \"${BACKEND_PM2_APP}\" ]; then
              pm2 restart \"${BACKEND_PM2_APP}\"
            fi
          "

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs:
      - backend-smoke
      - backend-auth-integration
      - frontend-build
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.DEPLOY_HOST != '' &&
      secrets.DEPLOY_USER != '' &&
      secrets.DEPLOY_SSH_KEY != '' &&
      vars.FRONTEND_DEPLOY_PATH != ''
    environment:
      name: production

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Package frontend artifact
        run: tar -czf frontend-dist.tgz -C frontend-dist .

      - name: Upload frontend artifact to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: scp frontend-dist.tgz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/frontend-dist.tgz"

      - name: Extract frontend artifact on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_DEPLOY_PATH: ${{ vars.FRONTEND_DEPLOY_PATH }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "
            set -e
            mkdir -p '${FRONTEND_DEPLOY_PATH}'
            tar -xzf /tmp/frontend-dist.tgz -C '${FRONTEND_DEPLOY_PATH}'
            rm -f /tmp/frontend-dist.tgz
          "
