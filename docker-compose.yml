services:
  postgres:
    image: postgres:16-alpine
    container_name: community_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_community
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - community_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_community"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: community_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: career_community
      DATABASE_URL: postgresql://postgres:password@postgres:5432/career_community
      JWT_SECRET: super-secret-key
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:8080,http://localhost:1133
      FRONTEND_URL: http://localhost:8080
      UPLOAD_DIR: uploads
      ALLOW_MOCK_OAUTH: "true"
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - community_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_JOBS_ENDPOINT: /jobs
        VITE_SOCKET_URL: http://localhost:8080
    container_name: community_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - community_network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: community_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.test
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - community_network

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: community_minio
    restart: unless-stopped
    profiles: ["tools"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - community_network

volumes:
  postgres_data:
  backend_uploads:
  pgadmin_data:
  minio_data:

networks:
  community_network:
    driver: bridge
